name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'seo/**'
  pull_request:
    branches:
      - main
      - 'seo/**'

jobs:
  verify:
    name: Lint, Audit, Scan & SEO Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run ESLint
        run: npm run lint

      - name: Verify build fails without mock CRM when upstream is unreachable
        run: |
          set +e
          CRM_API_BASE_URL="http://127.0.0.1:59999/api/public" CRM_API_KEY="test-unreachable-key" USE_MOCK_CRM= npm run build
          BUILD_EXIT=$?
          set -e
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "ERROR: Build succeeded when CRM was unreachable and USE_MOCK_CRM was unset! It must fail."
            exit 1
          else
            echo "SUCCESS: Build aborted and failed as expected with exit code $BUILD_EXIT"
          fi

      - name: Production Next.js Build (with explicit USE_MOCK_CRM=1 in CI)
        run: npm run build
        env:
          USE_MOCK_CRM: '1'
          NEXT_PUBLIC_SITE_URL: https://www.bharatproperties.co

      - name: Mock Leak Detector Guard
        run: npm run check:no-mock-leak
        env:
          USE_MOCK_CRM: '1'

      - name: SEO & SSR Quality Gate Check
        run: npm run seo:check
