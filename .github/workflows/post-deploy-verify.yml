name: Post-Deploy Verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to verify (e.g. https://www.bharatproperties.co or preview URL)'
        required: false
        default: 'https://www.bharatproperties.co'
        type: string

jobs:
  verify:
    name: Production HTTP Cutover Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Read-Only Post-Deploy Verification
        run: |
          TARGET_URL="${{ inputs.base_url || 'https://www.bharatproperties.co' }}"
          echo "Executing read-only verification against $TARGET_URL"
          npm run verify:prod -- "$TARGET_URL"
